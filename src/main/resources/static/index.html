<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexora - Conciliacion</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
        h1 { margin-bottom: 4px; }
        p.sub { margin-top: 0; color: #666; }
        form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: #f4f6f8; padding: 16px; border-radius: 6px; }
        label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
        input, select, button { padding: 8px; font-size: 14px; }
        button { background: #1f5fa8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: right; }
        th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
        .CONCILIADA { color: #1b7f3b; font-weight: bold; }
        .DIFERENCIA_EXPLICADA { color: #a06a00; font-weight: bold; }
        .INCONSISTENTE { color: #b3261e; font-weight: bold; }
        #error { color: #b3261e; margin-top: 10px; }
    </style>
</head>
<body>
<h1>Nexora</h1>
<p class="sub">Conciliacion de ventas contra abonos bancarios</p>

<form id="form">
    <label>Medio de pago
        <select id="medio"></select>
    </label>
    <label>Valor de la venta
        <input id="venta" type="number" step="0.01" value="250000" required>
    </label>
    <label>Valor abonado por el banco
        <input id="abono" type="number" step="0.01" value="241500" required>
    </label>
    <button type="submit">Conciliar y guardar</button>
</form>
<div id="error"></div>

<h2>Historial (guardado en PostgreSQL)</h2>
<table>
    <thead>
    <tr>
        <th>#</th><th>Medio</th><th>Venta</th><th>Abono</th>
        <th>Comision</th><th>Retencion</th><th>Sin explicar</th><th>Estado</th>
    </tr>
    </thead>
    <tbody id="historial"></tbody>
</table>

<script>
    const pesos = n => '$' + Number(n).toLocaleString('es-CO', { maximumFractionDigits: 2 });

    async function cargarMedios() {
        const medios = await (await fetch('/api/medios-pago')).json();
        document.getElementById('medio').innerHTML = medios
            .map(m => `<option value="${m.codigo}">${m.nombre} (comision ${m.tasaComision * 100}%)</option>`)
            .join('');
    }

    async function cargarHistorial() {
        const filas = await (await fetch('/api/conciliacion/historial')).json();
        document.getElementById('historial').innerHTML = filas.map(c => `
            <tr>
                <td>${c.id}</td><td>${c.medioPago}</td>
                <td>${pesos(c.resultado.montoVenta)}</td><td>${pesos(c.resultado.montoAbonado)}</td>
                <td>${pesos(c.resultado.comision)}</td><td>${pesos(c.resultado.retencion)}</td>
                <td>${pesos(c.resultado.diferenciaNoExplicada)}</td>
                <td class="${c.resultado.estado}">${c.resultado.estado}</td>
            </tr>`).join('');
    }

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        document.getElementById('error').textContent = '';
        const resp = await fetch('/api/conciliacion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                venta: document.getElementById('venta').value,
                abono: document.getElementById('abono').value,
                medioPago: document.getElementById('medio').value
            })
        });
        if (!resp.ok) {
            document.getElementById('error').textContent = 'No se pudo conciliar. Revisa los datos.';
            return;
        }
        cargarHistorial();
    });

    cargarMedios();
    cargarHistorial();
</script>
</body>
</html>
